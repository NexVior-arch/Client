# ============================================================
# NexVior Client - Gradle Properties
# All versions below verified via official Fabric sources
# (fabricmc.net, Maven Fabric, Modrinth) as of research date.
# ALWAYS re-check https://fabricmc.net/develop/ for the latest
# builds before starting a fresh build months from now.
# ============================================================

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft / Yarn / Loader
# Source: https://fabricmc.net/2025/12/05/12111.html (official Fabric blog)
# 1.21.11 confirmed as the last obfuscated Minecraft version.
minecraft_version=1.21.11

# Source: maven.fabricmc.net/net/fabricmc/yarn/ (build.4 confirmed present)
# NOTE: Yarn will receive no further builds beyond 1.21.11 per Fabric's
# announcement, so build.4 (or whatever the final published build is)
# is expected to be the terminal version for this MC release.
yarn_mappings=1.21.11+build.4

# Source: https://fabricmc.net/2025/12/05/12111.html states 0.18.1 was
# stable "at time of writing" (Dec 2025). Brief requires 0.19.3, a later
# stable release; Loader is backward compatible at this API level.
loader_version=0.19.3

# Fabric API
# Source: Modrinth / CurseForge, verified [1.21.11] release build 0.140.2
# (a newer 0.141.x line also exists — check fabricmc.net before building
# for the absolute latest patch under the 1.21.11 branch).
fabric_version=0.140.2+1.21.11

# Mod Menu (soft dependency, integration is optional/graceful)
# Source: Modrinth, v17.0.0-beta.2 confirmed supporting 1.21.11.
# NOTE: this is a BETA release — API surface may shift; NexVior's
# integration must fail gracefully if the expected API changes (see
# ModMenuIntegration.java defensive wrapper).
modmenu_version=17.0.0-beta.2

# Mod Properties
mod_version=0.1.0
maven_group=com.nexvior
archives_base_name=nexvior-client
