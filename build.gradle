plugins {
	id 'fabric-loom' version '1.14.10'
	// Loom 1.14.10: confirmed stable release supporting Gradle 8.14+ and
	// 9.0 (see FabricMC/fabric-loom GitHub Releases). Pinned to this exact
	// stable version rather than a -SNAPSHOT build for reproducible CI
	// builds. If a newer stable Loom has been published by the time you
	// build this, check whether it requires a newer Gradle version too
	// (Loom's release notes state 8.x support may be dropped in a future
	// release in favor of Gradle 9 only).
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu is published on its own maven + Modrinth maven
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	// Client-only mod: NexVior never runs logic server-side.
	splitEnvironmentSourceSets()

	mods {
		nexvior {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu integration — modCompileOnly + modLocalRuntime so the mod
	// compiles and can be tested locally with Mod Menu present, but does
	// NOT hard-fail if the end user doesn't have Mod Menu installed.
	// This matches the graceful-degradation requirement: NexVior must
	// work standalone without Mod Menu.
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
