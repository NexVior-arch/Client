plugins {
	id 'fabric-loom' version '1.14-SNAPSHOT'
	// NOTE: Loom 1.14 is the version officially recommended by Fabric
	// for Minecraft 1.21.11 development (fabricmc.net/2025/12/05/12111.html).
	// If a stable (non -SNAPSHOT) 1.14.x has been published by the time
	// you build this, pin to that exact stable version instead.
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu is published on its own maven + Modrinth maven
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	// Client-only mod: NexVior never runs logic server-side.
	splitEnvironmentSourceSets()

	mods {
		nexvior {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu integration — modCompileOnly + modLocalRuntime so the mod
	// compiles and can be tested locally with Mod Menu present, but does
	// NOT hard-fail if the end user doesn't have Mod Menu installed.
	// This matches the graceful-degradation requirement: NexVior must
	// work standalone without Mod Menu.
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
