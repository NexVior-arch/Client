name: Build NexVior Client

# Runs automatically on every push, and can also be triggered manually
# from the Actions tab (useful when you just want a fresh jar without
# pushing a new change).
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      # Uploads the compiled jar(s) as a downloadable "Artifact" on the
      # workflow run page — this is what you download from your phone.
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: nexvior-client-jar
          path: build/libs/*.jar
          if-no-files-found: error
